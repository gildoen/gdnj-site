# 설교 목록 자동 갱신 — GitHub 서버가 하루 4번 유튜브를 확인해
# 새 설교가 올라왔으면 사이트를 다시 만들어 반영한다.
# (미동부 시간 기준 대략 밤 10시 · 새벽 4시 · 오전 10시 · 오후 4시)
name: sermon-update

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch: {}        # GitHub 화면에서 수동 실행 버튼
  push:
    paths:
      - ".github/workflows/sermon-update.yml"   # 이 지시서가 바뀌면 시험 삼아 한 번 실행

permissions:
  contents: write

concurrency:
  group: sermon-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 페이지 다시 만들기 (유튜브 확인)
        run: python3 _build/build.py

      - name: 바뀐 내용이 있으면 올리기
        run: |
          git config user.name "gdnj-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "새 설교 없음 — 사이트 그대로 둠"
          else
            git commit -m "설교 목록 자동 갱신" -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
            git push
          fi
